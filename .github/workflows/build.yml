name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Find and unpack the newest source zip
        run: |
          echo "Zip files in the repository:"
          ls -la *.zip || { echo "ERROR: no .zip file found in the repository root. Upload moonlight-source.zip first."; exit 1; }
          newest=""
          newest_time=0
          for f in *.zip; do
            t=$(git log -1 --format=%ct -- "$f")
            echo "  $f was last uploaded at $t"
            if [ "${t:-0}" -ge "$newest_time" ]; then
              newest="$f"
              newest_time="${t:-0}"
            fi
          done
          echo "Using: $newest"
          unzip -q "$newest"
          if [ ! -f moonlight-android-12.2/app/src/main/java/com/limelight/ControlsEditorActivity.java ]; then
            echo "ERROR: this zip is an OLD version (no virtual controls editor inside). Upload the newest moonlight-source.zip."
            exit 1
          fi

      - name: Fetch native submodule
        working-directory: moonlight-android-12.2
        run: |
          rm -rf app/src/main/jni/moonlight-core/moonlight-common-c
          git clone --recursive https://github.com/moonlight-stream/moonlight-common-c.git app/src/main/jni/moonlight-core/moonlight-common-c

      - name: Install Android SDK parts
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37" "ndk;29.0.14206865" || true

      - name: Build
        working-directory: moonlight-android-12.2
        run: |
          chmod +x gradlew
          ./gradlew assembleNonRootDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: moonlight-apk
          path: moonlight-android-12.2/app/build/outputs/apk/**/*.apk
